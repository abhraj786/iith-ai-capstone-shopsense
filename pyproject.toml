[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-capstone-starter"
version = "0.1.0"
description = "ShopSense IIT Hyderabad Applied AI capstone"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=3.0",
    "qdrant-client>=1.12",
    "socksio>=1.0",
    "tenacity>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

# Add and pin the dependencies you actually use as milestones progress.
# Evaluation/scripts remain repository-level tooling, outside this package.
